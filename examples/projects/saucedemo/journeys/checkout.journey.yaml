version: 1
id: checkout
name: Buy one item from sign-in to the thank-you page
description: >
  standard_user should pass. problem_user and error_user are built to fail somewhere in checkout,
  and the report should say which step. performance_glitch_user should pass slowly.
users: [qa-user-1, qa-user-2, qa-user-3, qa-user-4, qa-user-5]
requires_phase1: true
tags: [shop, practice]
steps:
  - navigate: { url: "/" }
  - fill: { selector: "#user-name", credential: "self.username" }
  - fill: { selector: "#password", credential: "self.password" }
  - click: { selector: "#login-button" }
  - wait: { for: navigation }
  - assert: { type: url_contains, value: "/inventory.html" }
  - click: { selector: "#add-to-cart-sauce-labs-backpack" }
  - assert: { type: selector_visible, value: "[data-test='shopping-cart-badge']" }
  - click: { selector: "[data-test='shopping-cart-link']" }
  - assert: { type: url_contains, value: "/cart.html" }
  - click: { selector: "#checkout" }
  - fill: { selector: "#first-name", value: "Hornet" }
  - fill: { selector: "#last-name", value: "Swarm" }
  - fill: { selector: "#postal-code", value: "2000" }
  - click: { selector: "#continue" }
  - assert: { type: url_contains, value: "/checkout-step-two.html" }
  - click: { selector: "#finish" }
  - assert: { type: text_visible, value: "Thank you for your order!" }
  - screenshot: { name: "order-complete" }
