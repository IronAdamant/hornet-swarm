version: 1
id: guest-message
name: A guest's message reaches the admin inbox
description: A guest sends a message from the front page, then the admin finds it in Messages.
users: [qa-user-3]
requires_phase1: false
tags: [contact]
steps:
  - navigate: { url: "/" }
  - wait: { for: selector, selector: "[data-testid='ContactName']" }
  - fill: { selector: "[data-testid='ContactName']", value: "Robin Labguest" }
  - fill: { selector: "[data-testid='ContactEmail']", value: "robin.labguest@example.com" }
  - fill: { selector: "[data-testid='ContactPhone']", value: "04123456789" }
  - fill: { selector: "[data-testid='ContactSubject']", value: "Lab enquiry {{run.id}}" }
  - fill: { selector: "[data-testid='ContactDescription']", value: "Hello, do you have a quiet room with a garden view for two nights next month?" }
  - click: { selector: "role=button[name='Submit']" }
  - assert: { type: text_visible, value: "Thanks for getting in touch" }
  - screenshot: { name: "message-sent" }
  - navigate: { url: "/admin" }
  - fill: { selector: "#username", credential: "self.username" }
  - fill: { selector: "#password", credential: "self.password" }
  - click: { selector: "#doLogin" }
  - wait: { for: navigation }
  - assert: { type: url_contains, value: "/admin/rooms" }
  - navigate: { url: "/admin/message" }
  - assert: { type: text_visible, value: "Lab enquiry {{run.id}}" }
  - screenshot: { name: "message-in-inbox" }
