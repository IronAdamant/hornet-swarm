version: 1
id: guest-message
name: A guest sends a message from the front page
description: >
  A guest, with no account, fills in the contact form and sees the thanks. Whether the message
  reaches the admin's inbox is an admin journey, and waits for an admin login.
users: [qa-user-3]
requires_phase1: false
tags: [contact]
steps:
  - navigate: { url: "/" }
  - wait: { for: selector, selector: "[data-testid='ContactName']" }
  - fill: { selector: "[data-testid='ContactName']", value: "Robin Labguest" }
  - fill: { selector: "[data-testid='ContactEmail']", value: "robin.labguest@example.com" }
  - fill: { selector: "[data-testid='ContactPhone']", value: "04123456789" }
  - fill: { selector: "[data-testid='ContactSubject']", value: "Lab enquiry {{run.tag}}" }
  - fill: { selector: "[data-testid='ContactDescription']", value: "Hello, do you have a quiet room with a garden view for two nights next month?" }
  - click: { selector: "role=button[name='Submit']" }
  - assert: { type: text_visible, value: "Thanks for getting in touch" }
  - screenshot: { name: "message-sent" }
