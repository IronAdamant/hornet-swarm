# Installed to ~/.hornet-swarm/projects/toolshop-live/ by: node scripts/setup-practice.mjs toolshop-live
# The hosted Toolshop (sprint 5 with deliberate bugs) on the public internet: the same app as the
# local toolshop-lab, so differences between the two runs come from live conditions. Other testers
# share it. Three made-up customers, two browsers at a time, two requests a second each.
id: toolshop-live
name: Toolshop live (public practice, sprint 5 with bugs)
authorisation_id: toolshop-live-practice
environment: test
targets:
  base_url: https://with-bugs.practicesoftwaretesting.com
  allowed_origins:
    - https://with-bugs.practicesoftwaretesting.com
    - https://api-with-bugs.practicesoftwaretesting.com
  allowed_third_party:
    # The page's icon stylesheet. Cloudflare's analytics beacon stays blocked.
    - { origin: "https://cdnjs.cloudflare.com", passive: true }
auth:
  signin_url: "/#/auth/login"
  selectors:
    username: "[data-test='email']"
    password: "[data-test='password']"
    submit: "[data-test='login-submit']"
  success:
    - { type: selector_visible, value: "[data-test='nav-user-menu']" }
  auth_endpoints: ["**/users/login", "**/users/register"]
runners:
  count: 3
  memory: 1g
  cpus: 1
limits:
  max_parallel_runners: 2
  max_requests_per_second_per_runner: 2
  request_burst_per_runner: 20
  max_requests_per_second_total: 4
  min_step_delay_ms: 250
  max_run_duration_min: 30
  max_signin_attempts_per_user_per_hour: 10
phase2:
  gate: per_user
journeys_dir: ./journeys
users:
  - { label: qa-user-1, role: customer, tenant: toolshop, vars: { first_name: Mara, last_name: Quill, city: Testville } }
  - { label: qa-user-2, role: customer, tenant: toolshop, vars: { first_name: Tobin, last_name: Reyes, city: Testville } }
  - { label: qa-user-3, role: customer, tenant: toolshop, vars: { first_name: Iris, last_name: Calloway, city: Testville } }
