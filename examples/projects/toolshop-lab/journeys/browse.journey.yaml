version: 1
id: browse
name: Category filter and the Home link work
description: >
  A visitor filters the catalogue to hammers, then uses the menu's Home link to get back. Drafted
  from inspect_page maps of the home page, then run and corrected from the failure clues.
users: [qa-user-2]
requires_phase1: false
tags: [catalogue]
steps:
  - navigate: { url: "/#/" }
  - wait: { for: selector, selector: "a.card >> nth=0" }
  - click: { selector: "[data-test='category-3']" }
  # Hammers only: a hammer shows, and the pliers that lead the unfiltered list are gone.
  - assert: { type: text_visible, value: "Claw Hammer" }
  - assert: { type: selector_absent, value: "a.card:has-text('Combination Pliers')" }
  - screenshot: { name: "hammers-only" }
  # The menu's Home link should lead back to the catalogue, with its sort control.
  - click: { selector: "role=link[name='Home']" }
  - assert: { type: selector_visible, value: "[data-test='sort']" }
