version: 1
id: contact
name: A customer sends a message to customer service
users: [qa-user-5]
tags: [support]
steps:
  - navigate: { url: "/#/auth/login" }
  - fill: { selector: "[data-test='email']", credential: "self.username" }
  - fill: { selector: "[data-test='password']", credential: "self.password" }
  - click: { selector: "[data-test='login-submit']" }
  - wait: { for: navigation }
  - assert: { type: selector_visible, value: "[data-test='nav-user-menu']" }
  - navigate: { url: "/#/contact" }
  - wait: { for: selector, selector: "[data-test='subject']" }
  - select: { selector: "[data-test='subject']", label: "Customer service" }
  - fill: { selector: "[data-test='message']", value: "Hello, this is a lab test message. My order arrived and I would like to ask about delivery times." }
  - click: { selector: "[data-test='contact-submit']" }
  - assert: { type: text_visible, value: "Thanks for your message! We will contact you shortly." }
  - screenshot: { name: "message-sent" }
