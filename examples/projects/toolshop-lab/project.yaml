# Installed to ~/.hornet-swarm/projects/toolshop-lab/ by: node scripts/setup-lab.mjs
# Toolshop (Practice Software Testing, sprint 5 with deliberate bugs) running on this Mac.
# Five made-up customers and the seeded shop admin. The journeys assert what a working shop does,
# so each planted bug shows up as a failed step with the page's own words.
id: toolshop-lab
name: Toolshop lab (local, sprint 5 with bugs)
authorisation_id: lab-owner
environment: test
targets:
  base_url: http://127.0.0.1:4300
  allowed_origins:
    - http://127.0.0.1:4300
    - http://host.docker.internal:4300
    # The shop's API. Its build calls it as host.docker.internal:8091.
    - http://127.0.0.1:8091
    - http://host.docker.internal:8091
  # The page asks for a stylesheet on cdnjs.cloudflare.com. It stays blocked so the lab is offline.
  allowed_third_party: []
auth:
  signin_url: "/#/auth/login"
  selectors:
    username: "[data-test='email']"
    password: "[data-test='password']"
    submit: "[data-test='login-submit']"
  success:
    # Customers see the user menu. The admin sees the admin menu instead.
    - { type: selector_visible, value: ":is([data-test='nav-user-menu'], [data-test='nav-admin-menu']) >> nth=0" }
  auth_endpoints: ["**/users/login", "**/users/register"]
runners:
  count: 6
  memory: 1g
  cpus: 1
limits:
  max_parallel_runners: 3
  max_requests_per_second_per_runner: 10
  request_burst_per_runner: 40
  max_requests_per_second_total: 30
  min_step_delay_ms: 100
  max_run_duration_min: 30
  max_signin_attempts_per_user_per_hour: 30
phase2:
  gate: per_user
journeys_dir: ./journeys
users:
  - { label: qa-user-1, role: customer, tenant: toolshop, vars: { first_name: Mara, last_name: Quill, city: Testville } }
  - { label: qa-user-2, role: customer, tenant: toolshop, vars: { first_name: Tobin, last_name: Reyes, city: Testville } }
  - { label: qa-user-3, role: customer, tenant: toolshop, vars: { first_name: Iris, last_name: Calloway, city: Testville } }
  - { label: qa-user-4, role: customer, tenant: toolshop, vars: { first_name: Dev, last_name: Okafor, city: Testville } }
  - { label: qa-user-5, role: customer, tenant: toolshop, vars: { first_name: Lena, last_name: Marsh, city: Testville } }
  - { label: qa-user-6, role: admin, tenant: toolshop, vars: { first_name: John, last_name: Doe } }
