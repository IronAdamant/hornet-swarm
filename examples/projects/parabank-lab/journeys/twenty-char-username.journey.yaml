version: 1
id: twenty-char-username
name: A new 20-character username is accepted
description: >
  Signs up a new username of exactly 20 characters. With long-username (21 characters), this
  records the cutoff of P-02 in a saved run: 20 is accepted, 21 is refused as "already exists".
users: [qa-user-1]
requires_phase1: false
tags: [signup]
steps:
  - navigate: { url: "register.htm" }
  - fill: { selector: "[id='customer.firstName']", value: "Nova" }
  - fill: { selector: "[id='customer.lastName']", value: "Ledger" }
  - fill: { selector: "[id='customer.address.street']", value: "1 Test Street" }
  - fill: { selector: "[id='customer.address.city']", value: "Testville" }
  - fill: { selector: "[id='customer.address.state']", value: "NSW" }
  - fill: { selector: "[id='customer.address.zipCode']", value: "2000" }
  - fill: { selector: "[id='customer.phoneNumber']", value: "0412345678" }
  - fill: { selector: "[id='customer.ssn']", value: "123-45-6789" }
  # twentychar (10) + run tag (6) + abcd (4) = 20 characters.
  - fill: { selector: "[id='customer.username']", value: "twentychar{{run.tag}}abcd" }
  - fill: { selector: "[id='customer.password']", credential: "self.password" }
  - fill: { selector: "#repeatedPassword", credential: "self.password" }
  - click: { selector: "input[value='Register']" }
  - assert: { type: text_visible, value: "Your account was created successfully" }
  - screenshot: { name: "twenty-char-accepted" }
