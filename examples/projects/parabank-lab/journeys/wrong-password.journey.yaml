version: 1
id: wrong-password
name: A wrong password is refused with a clear message
users: [qa-user-4]
requires_phase1: false
tags: [signin]
steps:
  - navigate: { url: "index.htm" }
  - fill: { selector: "input[name='username']", credential: "self.username" }
  - fill: { selector: "input[name='password']", value: "definitely-not-the-password" }
  - click: { selector: "input[value='Log In']" }
  - assert: { type: text_visible, value: "The username and password could not be verified." }
  - assert: { type: selector_absent, value: "a:has-text('Log Out')" }
