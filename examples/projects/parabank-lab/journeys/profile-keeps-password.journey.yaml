version: 1
id: profile-keeps-password
name: Updating contact details leaves a password with a symbol working
description: >
  Signs up a fresh made-up customer with qa-user-5's password, which has a symbol in it, changes
  the phone number, signs out, and signs back in with the same password. Updating contact details
  must not change the password. On 14 October ParaBank's Update Profile page sent the password in
  a URL without encoding it, so a symbol cut it short and the sign-in failed.
users: [qa-user-5]
requires_phase1: false
tags: [account, signin]
steps:
  - navigate: { url: "register.htm" }
  - fill: { selector: "[id='customer.firstName']", value: "Zoe" }
  - fill: { selector: "[id='customer.lastName']", value: "Symbol" }
  - fill: { selector: "[id='customer.address.street']", value: "1 Test Street" }
  - fill: { selector: "[id='customer.address.city']", value: "Testville" }
  - fill: { selector: "[id='customer.address.state']", value: "NSW" }
  - fill: { selector: "[id='customer.address.zipCode']", value: "2000" }
  - fill: { selector: "[id='customer.phoneNumber']", value: "0412345678" }
  - fill: { selector: "[id='customer.ssn']", value: "123-45-6789" }
  - fill: { selector: "[id='customer.username']", value: "zoe{{run.tag}}" }
  - fill: { selector: "[id='customer.password']", credential: "self.password" }
  - fill: { selector: "#repeatedPassword", credential: "self.password" }
  - click: { selector: "input[value='Register']" }
  - assert: { type: text_visible, value: "Your account was created successfully" }
  - navigate: { url: "updateprofile.htm" }
  - assert: { type: field_value, selector: "[id='customer.firstName']", value: "Zoe" }
  - fill: { selector: "[id='customer.phoneNumber']", value: "0499999999" }
  - click: { selector: "input[value='Update Profile']" }
  - assert: { type: text_visible, value: "Profile Updated" }
  - click: { selector: "a:has-text('Log Out')" }
  - wait: { for: navigation }
  - fill: { selector: "input[name='username']", value: "zoe{{run.tag}}" }
  - fill: { selector: "input[name='password']", credential: "self.password" }
  - click: { selector: "input[value='Log In']" }
  - wait: { for: navigation }
  - assert: { type: text_visible, value: "Accounts Overview" }
  - screenshot: { name: "signed-in-after-update" }
