version: 1
id: wrong-password
name: A wrong password is refused
description: The site must stay on the login page and say the password is invalid.
users: [qa-user-1]
requires_phase1: true
tags: [negative, practice]
steps:
  - navigate: { url: "/login" }
  - fill: { selector: "#username", credential: "self.username" }
  - fill: { selector: "#password", value: "definitely-not-the-password" }
  - click: { selector: "button[type='submit']" }
  - wait: { for: navigation }
  - assert: { type: url_contains, value: "/login" }
  - assert: { type: text_visible, value: "Your password is invalid!" }
