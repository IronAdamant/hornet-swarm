# ~/.aegis/projects/consistencyhub/project.yaml
id: consistencyhub
name: ConsistencyHub (staging)
authorisation_id: consistencyhub-owner
environment: staging

targets:
  base_url: https://staging.consistencyhub.app
  allowed_origins:
    - https://staging.consistencyhub.app
  allowed_third_party:
    - { origin: https://cdn.consistencyhub.app, passive: true }   # assets only, no interaction
    - { origin: https://auth.consistencyhub.app, passive: false } # SSO; must be in authorisation scope

auth:
  signin_url: /login
  selectors:
    username: "#email"
    password: "#password"
    submit: "role=button[name='Sign in']"
  success:
    - { type: url_contains, value: "/dashboard" }
    - { type: selector_visible, value: "[data-testid='user-menu']" }
  auth_endpoints:                 # bodies dropped from traces/HAR
    - "**/login"
    - "**/oauth/token"
  totp:
    enabled: false

runners:
  count: 10                       # 1..30 (hard cap 30)
  memory: 1g
  cpus: 1.0

limits:
  max_parallel_runners: 10
  max_requests_per_second_per_runner: 5
  max_requests_per_second_total: 20
  min_step_delay_ms: 250
  max_run_duration_min: 30
  max_signin_attempts_per_user_per_hour: 5

phase2:
  gate: all                       # all | per_user

journeys_dir: ./journeys

# Non-secret, per-user variables (NEVER credentials). Credentials live in secrets.sops.yaml.
users:
  - { label: qa-user-1, role: consultant, tenant: A1, vars: { tenant_slug: a1, owned_resource_id: res_a1_001 } }
  - { label: qa-user-2, role: consultant, tenant: B1, vars: { tenant_slug: b1, owned_resource_id: res_b1_002 } }
  - { label: qa-user-3, role: introducer, tenant: A1, vars: {} }
  - { label: qa-user-4, role: staff,      tenant: A1, vars: {} }
  - { label: qa-user-5, role: consultant, tenant: C1, vars: {} }
  - { label: qa-user-6, role: consultant, tenant: C1, vars: {} }
  - { label: qa-user-7, role: consultant, tenant: D1, vars: {} }
  - { label: qa-user-8, role: staff,      tenant: D1, vars: {} }
  - { label: qa-user-9, role: introducer, tenant: B1, vars: {} }
  - { label: qa-user-10, role: consultant, tenant: E1, vars: {} }
