# ~/.hornet-swarm/config.yaml  (global)
runtime: auto                 # auto | orbstack | colima
default_project: example-app
results_retention_days: 30
ocr_screenshot_check: true    # OCR screenshots for leaked secrets
log_level: info
# Who client reports are from, unless a job says otherwise. The agency brand is the default:
# a report shows Iron Adamant only when `use: iron_adamant` is set here or in the job.
# A relative logo path is read from beside this file.
