# A public practice site. Nobody signed this. The site's own published words are the permission.
# The statement here is weaker than The Internet's: the repository calls it a sample application,
# and the login page publishes its test accounts and their password to every visitor.
id: saucedemo-practice
basis: public_practice
client: Sauce Demo / Swag Labs (Sauce Labs)
granted_to: Anyone practising test automation
public_statement:
  url: https://github.com/saucelabs/sample-app-web
  quote: "This is the Sauce Labs Sample Application which is designed to be used from desktop web browsers. The login page at https://www.saucedemo.com lists: Accepted usernames are: ... Password for all users: ..."
scope:
  domains: [www.saucedemo.com]
  environments: [test]
activities: [signin_smoke, functional_e2e]
exclusions:
  - No chaos, load, or access-control probing.
  - Never type a real name, address, or card number into the checkout.
valid_from: "2026-10-12"
valid_until: "2027-01-10"
notes: Every account shares the published password. Each account misbehaves on purpose.
