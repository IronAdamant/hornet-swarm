# A public practice site on the internet. Nobody signed this. The site's own published words are
# the permission: every page's footer says it is a demo application for software testing training.
# Other testers share it, so the project keeps to the gentlest limits and places few orders.
id: toolshop-live-practice
basis: public_practice
client: Practice Software Testing (Testsmith), sprint 5 with deliberate bugs
granted_to: Anyone practising test automation
public_statement:
  url: https://with-bugs.practicesoftwaretesting.com/
  quote: "This is a DEMO application, used for software testing training purpose."
scope:
  domains: [with-bugs.practicesoftwaretesting.com, api-with-bugs.practicesoftwaretesting.com]
  environments: [test]
activities: [signin_smoke, functional_e2e]
exclusions:
  - No chaos, load, or access-control probing.
  - No admin account. The shared catalogue and other testers' data are left alone.
  - At most one order per run. Never type a real name, address, or card number.
valid_from: "2026-10-14"
valid_until: "2027-01-12"
notes: The footer statement is drawn by the page's script, so the saved copy of the page's HTML records the address, not the words. The quote above was read from the page in a browser on 14 October 2026.
