# Local practice labs. Every port is bound to 127.0.0.1, so only this Mac can reach them.
# Runners reach them as host.docker.internal. Set up with: node scripts/setup-lab.mjs
#
#   Restful Booker Platform (a bed-and-breakfast site with an admin panel)
#     site  http://127.0.0.1:3300
#   ParaBank (Parasoft's demo online bank)
#     bank  http://127.0.0.1:8095/parabank
#   OWASP Juice Shop (a shop for customer journeys; its challenges stay out of the suite)
#     shop  http://127.0.0.1:3010
name: hornet-lab

# The booker's services share the site container's network, because the published site image
# sends some requests to localhost:3001 whatever its settings say. Every address is localhost.
x-rbp: &rbp
  network_mode: service:rbp-site
  depends_on: [rbp-site]
  restart: unless-stopped
  mem_limit: 448m

x-rbp-env: &rbp-env
  profile: prod
  authDomain: localhost
  bookingDomain: localhost
  messageDomain: localhost
  roomDomain: localhost
  JAVA_OPTS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport -XX:+UseSerialGC

services:
  rbp-site:
    image: mwinteringham/restfulbookerplatform_assets
    environment:
      BOOKING_API: http://localhost:3000
      ROOM_API: http://localhost:3001
      BRANDING_API: http://localhost:3002
      AUTH_API: http://localhost:3004
      MESSAGE_API: http://localhost:3006
      REPORT_API: http://localhost:3005
    ports:
      - "127.0.0.1:3300:80"
    restart: unless-stopped
    mem_limit: 256m
  rbp-booking:
    <<: *rbp
    image: mwinteringham/restfulbookerplatform_booking
    environment: *rbp-env
  rbp-room:
    <<: *rbp
    image: mwinteringham/restfulbookerplatform_room
    environment: *rbp-env
  rbp-branding:
    <<: *rbp
    image: mwinteringham/restfulbookerplatform_branding
    environment: *rbp-env
  rbp-auth:
    <<: *rbp
    image: mwinteringham/restfulbookerplatform_auth
    environment: *rbp-env
  rbp-report:
    <<: *rbp
    image: mwinteringham/restfulbookerplatform_report
    environment: *rbp-env
  rbp-message:
    <<: *rbp
    image: mwinteringham/restfulbookerplatform_message
    environment: *rbp-env

  parabank:
    image: parasoft/parabank
    ports:
      - "127.0.0.1:8095:8080"
    restart: unless-stopped
    mem_limit: 768m

  # Official image. Its database lives in the container, so setup-lab.mjs --reset replaces
  # the container and the shop comes back with its seed data.
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped
    mem_limit: 768m
