name: CI

# End-to-end tests need Docker or OrbStack, sops, age, and tesseract on a Mac.
# GitHub-hosted macOS runners do not provide that Docker engine, so this workflow
# does not run them. Run them locally with `pnpm test:e2e` against the offline fixture.
# The Linux job below does not run `pnpm test:e2e` and does not pretend to.

on:
  push:
  pull_request:

jobs:
  linux:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sops and age
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSL -o "$RUNNER_TEMP/sops" "https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64"
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops

      - name: Create a throwaway age key for the secret-store tests
        run: |
          key_file="$RUNNER_TEMP/age.txt"
          age-keygen -o "$key_file" >/dev/null
          key="$(grep '^AGE-SECRET-KEY-' "$key_file")"
          echo "::add-mask::$key"
          echo "SOPS_AGE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install Chromium for the runner control test
        run: pnpm --filter @hornet-swarm/runner exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Redaction gate
        run: pnpm test:coverage
