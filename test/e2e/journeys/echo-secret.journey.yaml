version: 1
id: echo-secret
name: Echo a seeded value
description: Puts the stored password into a visible field so redaction can be checked.
users: [qa-user-1]
requires_phase1: false
tags: [redaction]
vars: {}
retries: 0
steps:
  - navigate: { url: "/echo" }
  - fill: { selector: "#leak", credential: "qa-user-1.password" }
  - click: { selector: "#echo-go" }
  - wait: { for: timeout, ms: 400 }
  - screenshot: { name: "echo-visible" }
