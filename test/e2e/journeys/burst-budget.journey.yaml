version: 1
id: burst-budget
name: A burst is paced, not dropped
users: [qa-user-1]
requires_phase1: false
tags: [safety]
vars: {}
retries: 0
steps:
  - navigate: { url: "/burst" }
  - assert: { type: selector_visible, value: "#ready" }
  - wait: { for: selector, selector: "#all", ms: 30000 }
  - assert: { type: selector_absent, value: "#dropped" }
